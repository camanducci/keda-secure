name: Build Secure KEDA Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: camanducci

jobs:
  scan-dependencies:
    name: Scan Go Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  build-and-scan:
    name: Build and Scan Images
    runs-on: ubuntu-latest
    needs: scan-dependencies
    strategy:
      matrix:
        include:
          - image: keda
            dockerfile: Dockerfile
          - image: keda-metrics-apiserver
            dockerfile: Dockerfile.adapter
          - image: keda-admission-webhooks
            dockerfile: Dockerfile.webhooks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan image with Trivy
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 \
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image with Grype
        run: |
          grype ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }} --fail-on high

      - name: Save scan results
        if: always()
        run: |
          mkdir -p scan-results
          trivy image --format json \
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }} \
            > scan-results/${{ matrix.image }}-trivy.json

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ matrix.image }}
          path: scan-results/

  push-images:
    name: Push Images to Registry
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - image: keda
            dockerfile: Dockerfile
          - image: keda-metrics-apiserver
            dockerfile: Dockerfile.adapter
          - image: keda-admission-webhooks
            dockerfile: Dockerfile.webhooks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=local-secure
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: always()
    steps:
      - name: Download all scan results
        uses: actions/download-artifact@v4
        with:
          path: all-scan-results

      - name: Generate summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          for dir in all-scan-results/*/; do
            image=$(basename "$dir" | sed 's/scan-results-//')
            if [ -f "$dir"/*-trivy.json ]; then
              high=$(cat "$dir"/*-trivy.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length')
              critical=$(cat "$dir"/*-trivy.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length')
              if [ "$high" -eq 0 ] && [ "$critical" -eq 0 ]; then
                echo "| $image | ✅ Secure (0 HIGH, 0 CRITICAL) |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $image | ❌ Vulnerabilities ($high HIGH, $critical CRITICAL) |" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          done
